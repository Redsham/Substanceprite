name: Validate and package

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        shell: bash
        run: |
          shopt -s globstar nullglob
          for script in **/*.lua; do luac5.4 -p "$script"; done
      - name: Run algorithm tests
        run: lua5.4 tests/run.lua
      - name: Build archives
        run: python3 tools/package.py --source-output dist/Substanceprite-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Substanceprite
          path: |
            dist/Substanceprite.aseprite-extension
            dist/Substanceprite-source.zip
          if-no-files-found: error
